name: Windows Store MSIX artifact
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store version MAJOR.MINOR.PATCH (major > 0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: store-msix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and unsigned Store package
        shell: pwsh
        env:
          STORE_VERSION: ${{ inputs.version }}
        run: |
          ./gradlew.bat check packageMsix "-PreleaseVersion=$env:STORE_VERSION" --no-daemon
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Embedded runtime, media, fallback and native EXE smoke
        shell: pwsh
        env:
          STORE_VERSION: ${{ inputs.version }}
        run: |
          ./tools/store/Test-AppImage.ps1 -Version $env:STORE_VERSION -Jdk $env:JAVA_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: cookie-core-store-msix
          path: |
            build/store-*/*.msix
            build/store-*/*.sha256
            build/store-*/build-report.json
            build/store-*/image/CookieCore/AppxManifest.xml
          if-no-files-found: error
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-test-diagnostics
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/store-tests/
            build/app-image-smoke/**/result.txt
            build/app-image-smoke/**/native-result.txt
            build/app-image-smoke/**/*.png
          if-no-files-found: warn
# Artifact only. No releases, signing secrets, Store submission or automatic trigger.